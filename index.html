<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaosCrypt | فك تشفير البصمة الفوضوية</title>
    <link rel="stylesheet" href="decrypt-style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🌀 ChaosCrypt Decoder</div>
            <p class="subtitle">استرجع المقال أو الرابط المخفي عبر تصوير البصمة أو رفعها مع كلمة المرور</p>
        </header>

        <div class="main-content">
            <div class="control-panel">
                <div class="input-group">
                    <label>اختر طريقة إدخال صورة البصمة:</label>
                    
                    <!-- أزرار التحكم الجديدة للاختيار بين الكاميرا والملفات -->
                    <div class="upload-options">
                        <button type="button" id="btnLaunchCamera" class="btn-action">📸 فتح الكاميرا للتصوير</button>
                        <button type="button" id="btnSelectFile" class="btn-action">📁 اختيار صورة من الجهاز</button>
                    </div>

                    <!-- حقل الرفع المخفي الذي يتم تحفيزه بالزر -->
                    <input type="file" id="imageUpload" accept="image/png, image/jpeg" style="display: none;">
                    
                    <!-- حقل الكاميرا المباشر للهواتف -->
                    <input type="file" id="cameraUpload" accept="image/*" capture="environment" style="display: none;">

                    <div class="upload-zone" id="uploadZone">
                        <p id="uploadStatus">لم يتم اختيار أو تصوير أي شفرة حتى الآن</p>
                    </div>
                </div>

                <div class="input-group">
                    <label for="passwordInput">كلمة المرور السرية (المفتاح):</label>
                    <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور الصحيحة لفك القفل">
                </div>

                <div class="button-group">
                    <button id="btnDecrypt" class="btn-primary">🔓 فك تشفير واستخراج النص</button>
                </div>
            </div>

            <div class="preview-panel">
                <h3>المقال المسترجع</h3>
                <div class="result-wrapper">
                    <div id="textOutput" class="output-box" placeholder="سيظهر مقالك الثمين هنا بعد فك الشفرة بنجاح..."></div>
                </div>
                <button id="btnCopy" class="btn-secondary" style="display: none;">📋 نسخ المقال المستخرج</button>
            </div>
        </div>
        
        <footer>
            مشروع مفتوح المصدر على GitHub | ChaosCrypt © 2026
        </footer>
    </div>

    <script src="decrypt-script.js"></script>
</body>
</html>
